name: Release sync

# Rebuilds the site on Vercel when a new GetBox release is out, so the
# prerendered pages show it immediately. The page also refreshes the list at
# runtime; this only keeps the static HTML current.
#
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one for
# main, then add it here as the repository secret VERCEL_DEPLOY_HOOK_URL.
# For an instant update, GetBox's release workflow can call this one through
# `repository_dispatch` (event type: getbox-release) — see README.
on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [getbox-release]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/redeploy-on-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
